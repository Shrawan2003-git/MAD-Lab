<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline Content</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            color: #005ac1;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #555;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Network Error</h1>
        <p>The learning content could not be loaded because the network is unavailable.</p>
        <p>Please check your internet connection and try refreshing.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p><em>Local fallback loaded via Android WebView</em></p>
    </div>
</body>
</html>
